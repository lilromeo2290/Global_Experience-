# ============================================================
#  Nginx reverse proxy config for Global Experience
#  Serves your-domain.com → Node.js app on port 3000
# ============================================================
#
#  INSTALL on Webuzo VPS:
#
#  Option A — Let deploy.sh handle it (recommended):
#      bash deploy.sh --nginx-domain=your-domain.com
#
#  Option B — Manual:
#      1. Copy this file:
#         sudo cp nginx-production.conf /etc/nginx/conf.d/your-domain.com.conf
#      2. Edit and replace YOUR_DOMAIN with your real domain:
#         sudo nano /etc/nginx/conf.d/your-domain.com.conf
#      3. Test config:
#         sudo nginx -t
#      4. Reload:
#         sudo systemctl reload nginx
#
#  On Webuzo, the Nginx config directory may be:
#      /etc/nginx/conf.d/
#      /usr/local/apps/nginx/etc/conf.d/
#  Check with: nginx -t  (it prints the config path on errors)
# ============================================================

# Upstream — matches the PM2 process on port 3000
upstream nextjs_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP — redirect everything to HTTPS (uncomment after SSL is set up)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name YOUR_DOMAIN www.YOUR_DOMAIN;
#     return 301 https://$host$request_uri;
# }

# Main server block
server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Webuzo default document root — keep it, Nginx will proxy to Node instead
    root /home/globalexp/public_html;
    index index.html index.htm;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy to Next.js on port 3000
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;

        # WebSocket support (needed for Next.js HMR and chat features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer Server-Sent Events or streaming responses
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static assets — cache aggressively
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public folder images — cache for a week
    location /images/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Public gallery images
    location /gallery/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to the standalone server.js source
    location ~* ^/(server\.js|ecosystem\.config\.js|deploy\.sh|start\.sh) {
        deny all;
    }

    # Access and error logs
    access_log /var/log/nginx/your-domain.access.log;
    error_log /var/log/nginx/your-domain.error.log;
}

